spring.application.name=demo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass}
spring.jpa.hibernate.ddl-auto=update

name-aggregation.next-service-url=${NAME_AGGREGATION_NEXT_SERVICE_URL:http://18.216.74.156:8080/name/aggregation}
name-aggregation.recovery-file=${NAME_AGGREGATION_RECOVERY_FILE:target/name-aggregation-recovery.log}

resilience4j.retry.instances.nameAggregation.maxAttempts=${NAME_AGGREGATION_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.nameAggregation.waitDuration=${NAME_AGGREGATION_RETRY_WAIT_DURATION:500ms}
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2
resilience4j.circuitbreaker.instances.nameAggregation.failureRateThreshold=50
resilience4j.circuitbreaker.instances.nameAggregation.slidingWindowSize=5
resilience4j.circuitbreaker.instances.nameAggregation.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.nameAggregation.waitDurationInOpenState=10s
